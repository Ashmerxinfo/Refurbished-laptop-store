<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Cart - RefurbTech</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Cart CSS -->
    <link rel="stylesheet" href="cartstyle.css">

</head>


<body>


<div class="cart-page">


    <!-- ================= HEADER ================= -->

    <header class="cart-header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>


        <div class="header-title">

            <span>SHOPPING</span>

            <h1>MY CART</h1>

        </div>


        <div class="header-cart">

            <i class="fa-solid fa-cart-shopping"></i>

            <b id="headerCartCount">0</b>

        </div>

    </header>



    <!-- ================= CONTENT ================= -->

    <main class="cart-content">


        <!-- ================= CART ITEMS ================= -->

        <section class="cart-items-section">


            <div class="section-top">

                <div>

                    <span class="section-label">
                        YOUR ITEMS
                    </span>

                    <h2>
                        Shopping Cart
                    </h2>

                </div>


                <span
                    class="item-count"
                    id="itemCount"
                >
                    0 Items
                </span>

            </div>



            <!-- Products will load here -->

            <div
                class="cart-items"
                id="cartItems"
            ></div>


        </section>



        <!-- ================= PRICE DETAILS ================= -->

        <section
            class="price-details"
            id="priceDetails"
        >

            <div class="section-label">
                ORDER SUMMARY
            </div>

            <h2>
                Price Details
            </h2>


            <div class="price-card">


                <div class="price-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        ₹0
                    </strong>

                </div>


                <div class="price-row">

                    <span>
                        Discount
                    </span>

                    <strong
                        class="discount"
                        id="discount"
                    >
                        - ₹0
                    </strong>

                </div>


                <div class="price-row">

                    <span>
                        Delivery
                    </span>

                    <strong
                        class="delivery"
                        id="delivery"
                    >
                        FREE
                    </strong>

                </div>


                <div class="divider"></div>


                <div class="total-row">

                    <span>
                        Total Amount
                    </span>

                    <strong id="totalAmount">
                        ₹0
                    </strong>

                </div>


                <div class="saved-message">

                    <i class="fa-solid fa-circle-check"></i>

                    <span id="savedAmount">
                        You save ₹0 on this order
                    </span>

                </div>


            </div>


        </section>



        <!-- ================= CHECKOUT ================= -->

        <section
            class="checkout-section"
            id="checkoutSection"
        >

            <button
                class="checkout-btn"
                onclick="proceedCheckout()"
            >

                <span>

                    <i class="fa-solid fa-lock"></i>

                    Secure Checkout

                </span>


                <i class="fa-solid fa-arrow-right"></i>

            </button>


            <button
                class="continue-btn"
                onclick="continueShopping()"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Continue Shopping

            </button>

        </section>


    </main>



    <!-- ================= EMPTY CART ================= -->

    <section
        class="empty-cart"
        id="emptyCart"
        style="display:none;"
    >

        <div class="empty-icon">

            <i class="fa-solid fa-cart-shopping"></i>

        </div>


        <h2>
            Your Cart is Empty
        </h2>


        <p>
            Looks like you haven't added<br>
            anything to your cart yet.
        </p>


        <button
            onclick="continueShopping()"
            class="shop-now-btn"
        >

            <i class="fa-solid fa-bag-shopping"></i>

            Start Shopping

        </button>

    </section>


</div>



<!-- ================= JAVASCRIPT ================= -->

<script>


/* =========================================================
   CART DATA
   ========================================================= */

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    } catch (error) {

        return [];

    }

}



/* =========================================================
   SAVE CART
   ========================================================= */

function saveCart(cart) {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}



/* =========================================================
   LOAD CART
   ========================================================= */

function loadCart() {

    const cart = getCart();

    const cartItems =
        document.getElementById("cartItems");

    const emptyCart =
        document.getElementById("emptyCart");

    const priceDetails =
        document.getElementById("priceDetails");

    const checkoutSection =
        document.getElementById("checkoutSection");


    updateCartCount(cart);


    if (cart.length === 0) {

        cartItems.innerHTML = "";

        emptyCart.style.display = "flex";

        priceDetails.style.display = "none";

        checkoutSection.style.display = "none";

        document.getElementById("itemCount")
            .textContent = "0 Items";

        return;

    }


    emptyCart.style.display = "none";

    priceDetails.style.display = "block";

    checkoutSection.style.display = "block";


    cartItems.innerHTML = "";


    cart.forEach((item, index) => {

        cartItems.appendChild(
            createCartItem(item, index)
        );

    });


    updatePriceDetails(cart);

}



/* =========================================================
   CREATE CART ITEM
   ========================================================= */

function createCartItem(item, index) {

    const card =
        document.createElement("div");

    card.className = "cart-item";


    const image =
        item.image ||
        item.icon ||
        "fa-solid fa-laptop";


    const price =
        Number(item.price) || 0;


    const quantity =
        Number(item.quantity) || 1;


    const oldPrice =
        Number(item.oldPrice) || 0;


    const category =
        item.category || "PRODUCT";


    card.innerHTML = `

        <div class="cart-item-top">


            <div class="cart-product-image">

                <i class="${image}"></i>

            </div>


            <div class="cart-product-info">

                <span class="cart-category">
                    ${category}
                </span>


                <h3>
                    ${item.name || "Product"}
                </h3>


                <div class="cart-price">

                    <strong>
                        ₹${price.toLocaleString("en-IN")}
                    </strong>

                    ${
                        oldPrice > price
                        ? `
                        <del>
                            ₹${oldPrice.toLocaleString("en-IN")}
                        </del>
                        `
                        : ""
                    }

                </div>

            </div>


            <button
                class="remove-btn"
                onclick="removeItem(${index})"
            >

                <i class="fa-solid fa-trash-can"></i>

            </button>


        </div>



        <div class="cart-item-bottom">


            <div class="stock-text">

                <i class="fa-solid fa-circle-check"></i>

                Available

            </div>


            <div class="item-actions">


                <div class="quantity-control">


                    <button
                        onclick="decreaseQuantity(${index})"
                    >
                        −
                    </button>


                    <span>
                        ${quantity}
                    </span>


                    <button
                        onclick="increaseQuantity(${index})"
                    >
                        +
                    </button>


                </div>


                <div class="item-total">

                    ₹${(
                        price * quantity
                    ).toLocaleString("en-IN")}

                </div>


            </div>


        </div>

    `;


    return card;

}



/* =========================================================
   INCREASE QUANTITY
   ========================================================= */

function increaseQuantity(index) {

    const cart = getCart();

    const item = cart[index];


    if (!item) return;


    const available =
        Number(item.available) || 999;


    const current =
        Number(item.quantity) || 1;


    if (current >= available) {

        showMessage(
            "Maximum available quantity reached"
        );

        return;

    }


    item.quantity = current + 1;


    saveCart(cart);

    loadCart();

}



/* =========================================================
   DECREASE QUANTITY
   ========================================================= */

function decreaseQuantity(index) {

    const cart = getCart();

    const item = cart[index];


    if (!item) return;


    const current =
        Number(item.quantity) || 1;


    if (current <= 1) {

        removeItem(index);

        return;

    }


    item.quantity = current - 1;


    saveCart(cart);

    loadCart();

}



/* =========================================================
   REMOVE ITEM
   ========================================================= */

function removeItem(index) {

    const cart = getCart();


    if (!cart[index]) return;


    cart.splice(index, 1);


    saveCart(cart);

    loadCart();

}



/* =========================================================
   PRICE DETAILS
   ========================================================= */

function updatePriceDetails(cart) {


    let subtotal = 0;

    let originalTotal = 0;

    let totalItems = 0;


    cart.forEach(item => {

        const price =
            Number(item.price) || 0;


        const oldPrice =
            Number(item.oldPrice) || price;


        const quantity =
            Number(item.quantity) || 1;


        subtotal +=
            price * quantity;


        originalTotal +=
            oldPrice * quantity;


        totalItems += quantity;

    });


    const discount =
        Math.max(
            0,
            originalTotal - subtotal
        );


    document.getElementById("subtotal")
        .textContent =
        `₹${subtotal.toLocaleString("en-IN")}`;


    document.getElementById("discount")
        .textContent =
        `- ₹${discount.toLocaleString("en-IN")}`;


    document.getElementById("totalAmount")
        .textContent =
        `₹${subtotal.toLocaleString("en-IN")}`;


    document.getElementById("savedAmount")
        .textContent =
        `You save ₹${discount.toLocaleString("en-IN")} on this order`;


    document.getElementById("itemCount")
        .textContent =
        `${totalItems} ${totalItems === 1 ? "Item" : "Items"}`;

}



/* =========================================================
   CART COUNT
   ========================================================= */

function updateCartCount(cart) {

    const count =
        cart.reduce(
            (total, item) =>
                total +
                (Number(item.quantity) || 1),
            0
        );


    document.getElementById(
        "headerCartCount"
    ).textContent = count;

}



/* =========================================================
   BACK
   ========================================================= */

function goBack() {

    window.history.back();

}



/* =========================================================
   CONTINUE SHOPPING
   ========================================================= */

function continueShopping() {

    window.location.href =
        "index.html";

}



/* =========================================================
   CHECKOUT
   ========================================================= */

function proceedCheckout() {

    const cart = getCart();


    if (cart.length === 0) {

        showMessage(
            "Your cart is empty"
        );

        return;

    }

    window.location.href = "Checkout.html"
}



/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(message) {

    alert(message);

}



/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadCart();


</script>


</body>

</html>
